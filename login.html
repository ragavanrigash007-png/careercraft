<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        
        <form id="signup-form" class="auth-form active">
            <h2>Create Account</h2>
            <input type="text" id="signup-username" placeholder="Username" required>
            <input type="email" id="signup-email" placeholder="Email" required>
            <input type="password" id="signup-password" placeholder="Password" required>
            <button type="submit" class="btn">Sign Up</button>
            <p>Already have an account? <a href="#" id="show-signin">Sign In</a></p>
        </form>

        <form id="signin-form" class="auth-form hidden">
            <h2>Welcome Back</h2>
            <input type="email" id="signin-email" placeholder="Email" required>
            <input type="password" id="signin-password" placeholder="Password" required>
            <button type="submit" class="btn">Sign In</button>
            <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
        </form>

    </div>

    <script src="script.js"></script>
</body>
</html>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.auth-container {
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
}

.auth-form {
    display: flex;
    flex-direction: column;
    transition: all 0.5s ease-in-out;
}

.auth-form.hidden {
    display: none; /* Used by JS to toggle */
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
}

input[type="text"],
input[type="email"],
input[type="password"] {
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

.btn {
    background-color: #062e5e;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s;
}

.btn:hover {
    background-color: #09438a;
}

p {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

a {
    color: #062e5e;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

</style>
